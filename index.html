:root{--bg:#f2f8f8;--card:#fff;--ink:#1d2f3d;--muted:#566b7a;--line:#d8e8ea;--head:#0b3c5d;--c1:#1f9d94;--c2:#ff7a59;--c3:#e6a800;--c4:#7c6cf0;--c5:#3a9bdc;--soft:#f4fafa}
@media(prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#0e1d28;--card:#16293a;--ink:#e6f1f5;--muted:#9db4c2;--line:#27425a;--head:#8fd3ff;--c1:#3cc7bb;--c2:#ff9378;--c3:#ffd37a;--c4:#a79bff;--c5:#62b6ec;--soft:#1b3246}}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 "Nunito",system-ui,sans-serif}
h1,h2,h3,b.k{font-family:"Baloo 2","Trebuchet MS",system-ui,sans-serif}
header{position:relative;overflow:hidden;background:linear-gradient(120deg,#0b3c5d,#1d7a8c 60%,#1f9d94 110%);color:#fff;padding:calc(36px + env(safe-area-inset-top,0px)) 6% 30px}
header i{position:absolute;border-radius:50%}.a{width:150px;height:150px;right:-30px;top:-50px;background:#ffc857}.b{width:70px;height:70px;right:130px;bottom:-35px;background:#ff7a59}
header>div{position:relative;max-width:1000px;margin:auto}header h1{margin:0 0 4px;font-size:clamp(26px,5vw,40px);line-height:1.1;font-weight:800}header p{margin:0;color:#dff3f1}
main{max-width:1000px;margin:auto;padding:18px}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin-bottom:18px}
.pick button{font:800 18px "Baloo 2",system-ui,sans-serif;padding:10px;border-radius:16px;border:2px solid var(--line);background:var(--card);color:var(--head);cursor:pointer}
.pick button[aria-pressed=true]{background:var(--head);color:var(--card);border-color:var(--head)}
.tabs{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.tabs button,.pr{font:700 15px "Nunito",system-ui,sans-serif;padding:8px 18px;border-radius:999px;border:2px solid var(--c1);background:var(--card);color:var(--ink);cursor:pointer}
.tabs button[aria-pressed=true]{background:var(--c1);color:#05302c}
.pr{margin-left:auto;border-color:var(--c2)}
.paper{background:var(--card);border:1px solid var(--line);border-top:8px solid var(--c1);border-radius:22px;padding:24px 26px}
.paper h2{margin:0;font-size:24px;color:var(--head);text-align:center}.sub{text-align:center;color:var(--muted);margin:2px 0 12px}
.meta{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 16px;border-top:2px dotted var(--line);border-bottom:2px dotted var(--line);padding:8px 0;font-weight:700}
.who{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0;font-size:15px}.who span{border-bottom:2px solid var(--muted);padding-bottom:14px}
.gi{background:var(--soft);border-left:6px solid var(--c3);border-radius:12px;padding:10px 16px;margin:12px 0}.gi b{color:var(--head)}.gi ol{margin:4px 0 0;padding-left:20px}
.sec{margin:20px 0 6px}.sec h3{margin:0;font-size:19px;color:var(--head)}.sec h3 em{font:600 14px "Nunito",sans-serif;font-style:normal;color:var(--muted);float:right}
.ins{margin:2px 0 8px;padding:6px 12px;background:var(--soft);border-radius:10px;border-left:5px solid var(--sec,var(--c1));font-size:15px}
.hint{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 8px}.hint span{padding:2px 12px;border-radius:999px;background:var(--c4);color:#fff;font-weight:700;font-size:14px}
.q{margin:6px 0;padding-left:30px;position:relative}.q>b{position:absolute;left:0}
.opt{display:flex;flex-wrap:wrap;gap:2px 22px;color:var(--muted)}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:4px 22px}
.sec:nth-of-type(5n+1){--sec:var(--c1)}.sec:nth-of-type(5n+2){--sec:var(--c2)}.sec:nth-of-type(5n+3){--sec:var(--c3)}.sec:nth-of-type(5n+4){--sec:var(--c4)}.sec:nth-of-type(5n){--sec:var(--c5)}
.msg{padding:30px;text-align:center;color:var(--muted)}
footer{text-align:center;color:var(--muted);padding:18px;font-size:14px}
@media(max-width:600px){.paper{padding:16px}.who{grid-template-columns:1fr}.mt{grid-template-columns:1fr}.sec h3 em{float:none;display:block}}
@media print{body{background:#fff;color:#000}header,.pick,.tabs,footer{display:none}.paper{border:0;padding:0}main{padding:0}.sec{break-inside:avoid}.ins,.gi{background:#f3f3f3}.hint span{background:#555}}

<header><i class="a"></i><i class="b"></i><div><h1 id="ht">Information Technology Tests</h1><p>Choose your class, then choose a test. Solve it in your notebook.</p></div></header>
<main><div class="pick" id="pick" role="group" aria-label="Choose your class"></div><div id="out"><p class="msg">Loading tests…</p></div></main>
<footer id="ft"></footer>
<script>
var D,cls=0,tn=1,L='abcdefgh';
function h(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function go(n,t){cls=n;tn=t||1;location.hash=n?'class-'+n+(t?'-test-'+t:''):'';draw()}
function read(){var m=/class-(\d+)(?:-test-(\d+))?/.exec(location.hash);cls=m?+m[1]:0;tn=m&&m[2]?+m[2]:1}
function draw(){
 var p=document.getElementById('pick'),o=document.getElementById('out');p.textContent='';o.textContent='';
 D.classes.forEach(function(c){var b=h('button','', 'Class '+c.n);b.setAttribute('aria-pressed',c.n===cls);b.onclick=function(){go(c.n)};p.appendChild(b)});
 var c=D.classes.filter(function(x){return x.n===cls})[0];
 if(!c){o.appendChild(h('p','msg','Select your class above to see your tests.'));return}
 var t=c.tests.filter(function(x){return x.n===tn})[0]||c.tests[0];
 var tabs=h('div','tabs');c.tests.forEach(function(x){var b=h('button','','Test '+x.n);b.setAttribute('aria-pressed',x.n===t.n);b.onclick=function(){go(c.n,x.n)};tabs.appendChild(b)});
 var pr=h('button','pr','Print this test');pr.onclick=function(){window.print()};tabs.appendChild(pr);o.appendChild(tabs);
 var pa=h('div','paper');pa.appendChild(h('h2','',D.school));pa.appendChild(h('div','sub',D.subject+' • Class '+c.n+' • '+c.topic));
 var m=h('div','meta');[ 'Test '+t.n+': '+t.title,'Maximum Marks: '+t.total,'Time: '+t.time].forEach(function(x){m.appendChild(h('span','',x))});pa.appendChild(m);
 var w=h('div','who');['Name:','Roll No.:','Date:'].forEach(function(x){w.appendChild(h('span','',x))});pa.appendChild(w);
 var g=h('div','gi');g.appendChild(h('b','','General Instructions'));var ol=h('ol');D.general.forEach(function(x){ol.appendChild(h('li','',x))});g.appendChild(ol);pa.appendChild(g);
 t.secs.forEach(function(s,i){
  var d=h('div','sec'),hh=h('h3','','Section '+String.fromCharCode(65+i));hh.appendChild(h('em','','['+s.items.length+' × '+s.m+' = '+s.items.length*s.m+' marks]'));d.appendChild(hh);
  d.appendChild(h('div','ins',s.note||D.instr[s.t]));
  if(s.box){var bx=h('div','hint');s.box.split(',').forEach(function(x){bx.appendChild(h('span','',x.trim()))});d.appendChild(bx)}
  if(s.t==='match'){var rs=s.items.map(function(x){return x[1]}),k=rs.slice().reverse();k.push(k.shift());
   var g2=h('div','mt');g2.appendChild(h('b','k','Column A'));g2.appendChild(h('b','k','Column B'));
   s.items.forEach(function(x,j){g2.appendChild(h('div','',(j+1)+'. '+x[0]));g2.appendChild(h('div','',L[j]+'. '+k[j]))});d.appendChild(g2)}
  else s.items.forEach(function(x,j){var q=h('div','q');q.appendChild(h('b','',(j+1)+'.'));
   if(s.t==='mcq'){q.appendChild(h('div','',x[0]));var oo=h('div','opt');x[1].forEach(function(y,z){oo.appendChild(h('span','',L[z]+'. '+y))});q.appendChild(oo)}
   else q.appendChild(h('div','',x));d.appendChild(q)});
  pa.appendChild(d)});
 o.appendChild(pa);document.title='Class '+c.n+' Test '+t.n+' – '+D.subject}
if(window.TESTS){D=window.TESTS;document.getElementById('ht').textContent=D.subject+' Class Tests';document.getElementById('ft').textContent=D.school;read();draw()}
else document.getElementById('out').textContent='The file tests.js was not found. Upload tests.js in the same folder as index.html.';
window.addEventListener('hashchange',function(){if(D){read();draw()}});
</script></body></html>
